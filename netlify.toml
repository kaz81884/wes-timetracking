[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Client-side routing: any non-file, non-function path falls back to index.html.
# Netlify resolves the /api/data function route before this, so it won't
# swallow API calls.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
